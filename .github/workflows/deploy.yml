name: Deploy to GitHub Pages

on:
  push:
    branches: [ spike/blazor ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
        
    - name: Restore dependencies
      run: dotnet restore src/AwesomeDevStreams/AwesomeDevStreams.csproj
      
    - name: Build
      run: dotnet build src/AwesomeDevStreams/AwesomeDevStreams.csproj -c Release --no-restore
      
    - name: Publish
      run: dotnet publish src/AwesomeDevStreams/AwesomeDevStreams.csproj -c Release -o publish --no-build
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
